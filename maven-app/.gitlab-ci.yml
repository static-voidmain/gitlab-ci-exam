stages:
  - build
  - coverage
  - sbom
  - scan
  - publish
  - release

include:
  # 실제 상위 그룹의 공통 CI 템플릿 프로젝트 경로로 변경하세요.
  - project: 'platform/gitlab-ci-templates'
    ref: 'main'
    file:
      - '/ci/common.yml'
      - '/scripts/upload_to_nexus.yml'

variables:
  MAVEN_CLI_OPTS: '-B -q'
  MAVEN_PROJECT_DIR: 'maven-app'
  MAVEN_BUILD_ENABLED: 'true'
  CODE_COVERAGE_MIN: '80'
  CODERAY_TIMEOUT_SECONDS: '1800'
  CODERAY_POLL_INTERVAL_SECONDS: '15'
  DEPENDENCY_TRACK_URL: 'https://dependency-track.example.com'
  NEXUS_UPLOAD_ENABLED: 'false'
  NEXUS_REPOSITORY_FORMAT: 'maven2'

maven-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd maven-app
    - mvn $MAVEN_CLI_OPTS clean verify
    - |
      line=$(grep '<counter type="LINE"' target/site/jacoco/jacoco.xml || true)
      missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
      covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
      total=$((missed + covered))
      percent=$(awk "BEGIN { if ($total == 0) print 0; else printf \"%.2f\", ($covered / $total) * 100 }")
      echo "Line coverage: $percent%"
  artifacts:
    paths:
      - maven-app/target/*.war
      - maven-app/target/site/jacoco/*
    expire_in: 1 week
  coverage: '/Line coverage: (\d+\.\d+)%/'
  rules:
    - changes:
        - maven-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

coverage-check:
  stage: coverage
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - bash scripts/check_coverage.sh maven-app/target/site/jacoco/jacoco.xml
  rules:
    - changes:
        - maven-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

sbom-check:
  stage: sbom
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd maven-app
    - mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.7.4:makeAggregateBom -DskipTests
    - cp target/bom.xml $CI_PROJECT_DIR/sbom-maven.xml
  artifacts:
    paths:
      - sbom-maven.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/|^release\/|^hotfix\//'
      when: on_success
    - when: never

coderay-scan:
  stage: scan
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/coderay_scan.sh
  artifacts:
    when: always
    paths:
      - coderay-xg-results/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: on_success
    - when: never

version-bump:
  stage: release
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/version_bump.sh "$VERSION"
    - git tag -a "v$VERSION" -m "Release v$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
