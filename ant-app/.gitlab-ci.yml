stages:
  - build
  - coverage
  - sbom
  - scan
  - publish
  - release

include:
  # 실제 상위 그룹의 공통 CI 템플릿 프로젝트 경로로 변경하세요.
  - project: 'platform/gitlab-ci-templates'
    ref: 'main'
    file:
      - '/ci/common.yml'
      - '/scripts/upload_to_nexus.yml'

variables:
  ANT_PROJECT_DIR: 'ant-app'
  ANT_BUILD_ENABLED: 'true'
  CODE_COVERAGE_MIN: '80'
  CODERAY_TIMEOUT_SECONDS: '1800'
  CODERAY_POLL_INTERVAL_SECONDS: '15'
  DEPENDENCY_TRACK_URL: 'https://dependency-track.example.com'
  ANT_NEXUS_GROUP_ID: 'com.example'
  NEXUS_UPLOAD_ENABLED: 'false'
  NEXUS_REPOSITORY_FORMAT: 'maven2'

ant-build:
  stage: build
  image: eclipse-temurin:17-jdk-jammy
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ant curl
  script:
    - cd ant-app
    - ant clean jar coverage-report
    - |
      line=$(grep '<counter type="LINE"' build/reports/jacoco/jacoco.xml || true)
      missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
      covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
      total=$((missed + covered))
      percent=$(awk "BEGIN { if ($total == 0) print 0; else printf \"%.2f\", ($covered / $total) * 100 }")
      echo "Line coverage: $percent%"
  artifacts:
    paths:
      - ant-app/build/*.jar
      - ant-app/build/jacoco.exec
      - ant-app/build/reports/jacoco/jacoco.xml
    expire_in: 1 week
  coverage: '/Line coverage: (\d+\.\d+)%/'
  rules:
    - changes:
        - ant-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

coverage-check:
  stage: coverage
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - bash scripts/check_coverage.sh ant-app/build/reports/jacoco/jacoco.xml
  rules:
    - changes:
        - ant-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

sbom-check:
  stage: sbom
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash
  script:
    - cd ant-app
    - bash ../scripts/generate_sbom.sh
    - cp sbom-ant.xml $CI_PROJECT_DIR/sbom-ant.xml
  artifacts:
    paths:
      - sbom-ant.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/|^release\/|^hotfix\//'
      when: on_success
    - when: never

coderay-scan:
  stage: scan
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/coderay_scan.sh
  artifacts:
    when: always
    paths:
      - coderay-xg-results/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: on_success
    - when: never

version-bump:
  stage: release
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/version_bump.sh "$VERSION"
    - git tag -a "v$VERSION" -m "Release v$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
