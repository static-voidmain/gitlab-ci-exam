stages:
  - build
  - coverage
  - sbom
  - scan
  - release

variables:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -q'
  CODE_COVERAGE_MIN: '80'
  CODERAY_API_URL: 'https://coderay.example.com/api'
  DEPENDENCY_TRACK_URL: 'https://dependency-track.example.com'

gradle-build:
  stage: build
  image: gradle:8.4.1-jdk17
  script:
    - cd gradle-app
    - gradle clean test jacocoTestReport --no-daemon
    - |
      line=$(grep '<counter type="LINE"' build/reports/jacoco/test/jacocoTestReport.xml || true)
      missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
      covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
      total=$((missed + covered))
      percent=$(awk "BEGIN { if ($total == 0) print 0; else printf \"%.2f\", ($covered / $total) * 100 }")
      echo "Line coverage: $percent%"
  artifacts:
    paths:
      - gradle-app/build/libs/*.war
      - gradle-app/build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 1 week
  coverage: '/Line coverage: (\d+\.\d+)%/'
  rules:
    - changes:
        - gradle-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

coverage-check:
  stage: coverage
  image: maven:3.8.7-openjdk-17
  script:
    - bash scripts/check_coverage.sh gradle-app/build/reports/jacoco/test/jacocoTestReport.xml
  rules:
    - changes:
        - gradle-app/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

sbom-check:
  stage: sbom
  image: maven:3.8.7-openjdk-17
  script:
    - cd gradle-app
    - gradle -q cyclonedxBom --no-daemon
    - cp build/reports/bom.xml $CI_PROJECT_DIR/sbom-gradle.xml
  artifacts:
    paths:
      - sbom-gradle.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^feature\/|^release\/|^hotfix\//'
      when: on_success
    - when: never

coderay-scan:
  stage: scan
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - bash scripts/coderay_scan.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: on_success
    - when: never

version-bump:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/version_bump.sh "$VERSION"
    - git tag -a "v$VERSION" -m "Release v$VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
