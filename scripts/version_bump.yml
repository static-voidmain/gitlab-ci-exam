version-bump:
  stage: release
  image: $CI_UTILITY_IMAGE
  before_script:
    - apk add --no-cache bash git perl xmlstarlet
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      set -euo pipefail

      if [[ -z "${VERSION:-}" ]]; then
        echo "VERSION 환경 변수가 필요합니다. 예: VERSION=1.2.3"
        exit 1
      fi

      if ! [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
        echo "VERSION 값이 일반적인 SemVer 형식이 아닙니다. current=$VERSION"
        exit 1
      fi

      changed_count=0
      maven_pom="${VERSION_BUMP_MAVEN_POM:-${MAVEN_PROJECT_DIR%/}/pom.xml}"
      gradle_build="${VERSION_BUMP_GRADLE_BUILD:-${GRADLE_PROJECT_DIR%/}/build.gradle}"
      ant_build="${VERSION_BUMP_ANT_BUILD:-${ANT_PROJECT_DIR%/}/build.xml}"

      if [[ -f "$maven_pom" ]]; then
        maven_version="$(xmlstarlet sel -N x="http://maven.apache.org/POM/4.0.0" -t -v "/x:project/x:version" "$maven_pom" 2>/dev/null || true)"
        plain_maven_version="$(xmlstarlet sel -t -v "/project/version" "$maven_pom" 2>/dev/null || true)"

        if [[ -n "$maven_version" ]]; then
          xmlstarlet ed -L -N x="http://maven.apache.org/POM/4.0.0" -u "/x:project/x:version" -v "$VERSION" "$maven_pom"
        elif [[ -n "$plain_maven_version" ]]; then
          xmlstarlet ed -L -u "/project/version" -v "$VERSION" "$maven_pom"
        else
          echo "Maven project version 경로를 찾지 못했습니다. file=$maven_pom"
          exit 1
        fi

        git add "$maven_pom"
        changed_count=$((changed_count + 1))
        echo "Maven version updated: $maven_pom"
      fi

      if [[ -f "$gradle_build" ]]; then
        perl -pi -e 's#version = "[^"]+"#version = "'"$VERSION"'"#' "$gradle_build"
        perl -pi -e "s#version = '[^']+'#version = '$VERSION'#" "$gradle_build"
        git add "$gradle_build"
        changed_count=$((changed_count + 1))
        echo "Gradle version updated: $gradle_build"
      fi

      if [[ -f "$ant_build" ]]; then
        perl -pi -e 's#<property name="project.version" value="[^"]+"\s*/>#<property name="project.version" value="'"$VERSION"'" />#' "$ant_build"
        git add "$ant_build"
        changed_count=$((changed_count + 1))
        echo "Ant version updated: $ant_build"
      fi

      if [[ "$changed_count" -eq 0 ]]; then
        echo "갱신할 빌드 파일을 찾지 못했습니다. VERSION_BUMP_* 또는 *_PROJECT_DIR 변수를 확인하세요."
        exit 1
      fi

      git diff --cached --check
      git tag -a "v$VERSION" -m "Release v$VERSION"
  rules:
    - if: '$VERSION_BUMP_ENABLED == "true" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
